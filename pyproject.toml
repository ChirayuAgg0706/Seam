[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seam-debugger"
version = "0.1.0"
description = "A mixed-mode Python + native debugger for Linux"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
seam = "seam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"seam._target" = ["*.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
