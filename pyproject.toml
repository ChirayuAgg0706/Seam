[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "seam-debugger"
dynamic = ["version"]
description = "Debug Python and C, C++ or Rust in one session on Linux x86-64, including WSL."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["debugger", "python", "native", "rust", "lldb", "dap", "wsl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
]

[project.urls]
Homepage = "https://github.com/ChirayuAgg0706/Seam"
Documentation = "https://github.com/ChirayuAgg0706/Seam#readme"
Issues = "https://github.com/ChirayuAgg0706/Seam/issues"
Releases = "https://github.com/ChirayuAgg0706/Seam/releases"

[tool.setuptools.dynamic]
version = { attr = "seam.__version__" }

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
seam = "seam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"seam._target" = ["*.c"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
    "B905",  # zip() without strict=: the lists zipped here are built together
    "E741",  # short names in comprehensions
]

[tool.ruff.lint.per-file-ignores]
"tests/targets/*" = ["F841", "B007"]  # variables that exist to be looked at in the debugger

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/targets holds the programs the scenarios debug; one of them is a pytest project.
norecursedirs = ["targets", "build", ".*"]
addopts = "-ra"
markers = [
    "smoke: the subset run on every cell of the Python version x optimisation matrix",
]
