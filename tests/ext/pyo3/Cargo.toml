[package]
name = "seam_pyo3"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "seam_pyo3"
crate-type = ["cdylib"]

[dependencies]
# abi3: one build serves every Python version under test.
pyo3 = { version = ">=0.23", features = ["extension-module", "abi3-py312"] }

[profile.release]
debug = true
