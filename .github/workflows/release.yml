name: release artifacts

# Builds and validates release assets. Publication is separate: GitHub assets are
# attached after validation; publish-pypi.yml publishes those same assets to PyPI.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Apple Silicon wheel and .vsix
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and check Apple Silicon distributions
        run: |
          python tools/check_versions.py
          python -m pip install build twine
          ARCHFLAGS='-arch arm64' MACOSX_DEPLOYMENT_TARGET=14.0 _PYTHON_HOST_PLATFORM=macosx-14.0-arm64 python -m build --wheel
          bash scripts/build-vsix.sh dist/*.whl
          cp vscode/*.vsix dist/
          python -m twine check --strict dist/*.whl
      - name: Check both installed packages
        run: |
          python -m venv "$RUNNER_TEMP/mac-wheel"
          "$RUNNER_TEMP/mac-wheel/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/mac-wheel/bin/seam" doctor --python python3
          node vscode/test/unit.js --adapter
      - name: Release checksums
        run: |
          cd dist
          shasum -a 256 *.whl *.vsix > SHA256SUMS-macos
      - uses: actions/upload-artifact@v4
        with:
          name: seam-macos-release-artifacts
          path: dist/*
          if-no-files-found: error
  build:
    name: wheel, sdist and .vsix
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Versions agree
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            python3 tools/check_versions.py "${GITHUB_REF_NAME}"
          else
            python3 tools/check_versions.py
          fi
      - name: Build the sdist and a manylinux wheel
        # One stable-ABI wheel serves every supported CPython, and carries the compiled
        # helper, so installing it needs no compiler.
        run: |
          docker run --rm -v "$PWD":/io -w /io quay.io/pypa/manylinux_2_28_x86_64 bash -c '
            set -e
            /opt/python/cp312-cp312/bin/python -m pip install --quiet build
            /opt/python/cp312-cp312/bin/python -m build --outdir /tmp/dist
            auditwheel repair /tmp/dist/*.whl --wheel-dir /io/dist
            cp /tmp/dist/*.tar.gz /io/dist/
            chown -R '"$(id -u):$(id -g)"' /io/dist
          '
          ls -l dist
      - name: Build the .vsix around the wheel's adapter and helper
        # The extension carries the seam package. Taking it from the manylinux wheel gives
        # the released extension a helper that loads on old distributions too.
        run: scripts/build-vsix.sh dist/*.whl && cp vscode/*.vsix dist/
      - name: The wheel works on a machine with no compiler involved
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lldb python3-venv
          sudo sysctl -w kernel.yama.ptrace_scope=0
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --no-index --find-links dist seam-debugger
          "$RUNNER_TEMP/venv/bin/seam" --version
          "$RUNNER_TEMP/venv/bin/seam" doctor --python python3
      - name: The adapter inside the .vsix works
        run: |
          python3 -m zipfile -e dist/*.vsix "$RUNNER_TEMP/vsix"
          python3 -m zipfile -e dist/*.whl "$RUNNER_TEMP/wheel"
          cmp "$RUNNER_TEMP/vsix/extension/bundled/seam/_target/_seam_trap.abi3.so"               "$RUNNER_TEMP/wheel/seam/_target/_seam_trap.abi3.so"
          node vscode/test/unit.js --adapter
      - name: Package metadata is ready for PyPI
        run: |
          python3 -m venv "$RUNNER_TEMP/metadata-check"
          "$RUNNER_TEMP/metadata-check/bin/pip" install --quiet twine
          "$RUNNER_TEMP/metadata-check/bin/python" -m twine check --strict dist/*.whl dist/*.tar.gz
      - name: Release checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz *.vsix > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: seam-release-artifacts
          path: dist/*
          if-no-files-found: error
