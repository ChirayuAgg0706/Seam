name: Apple Silicon validation

on:
  push:
    branches: [main, codex/macos-stage1]
  workflow_dispatch:
    inputs:
      only:
        description: Which validation jobs to run
        type: choice
        default: all
        options: [all, real-projects-and-scale, debugger-exit-regressions]

permissions:
  contents: read

concurrency:
  group: apple-silicon-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

jobs:
  mac14-attach-regressions:
    if: ${{ !inputs.only || inputs.only == 'all' }}
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - run: python -m pip install pytest pybind11 nanobind cython uv
      - name: Update breakpoints while an attached process runs
        env:
          SEAM_LLDB: /usr/bin/lldb
          SEAM_TEST_REPEAT: '5'
        run: |
          cd "$GITHUB_WORKSPACE"
          python -m pytest tests/test_attach_features.py --target-python "$(which python)" --basetemp="$RUNNER_TEMP/mac14-focused" --junitxml=mac14-focused.xml -ra
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac14-focused
          path: |
            mac14-focused.xml
            ${{ runner.temp }}/mac14-focused/
  optimized-regressions:
    if: ${{ !inputs.only || inputs.only == 'all' }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: arm64
      - run: python -m pip install pytest pybind11 nanobind cython uv
      - name: Optimized native stack, globals and inline stepping
        env:
          SEAM_LLDB: /usr/bin/lldb
          SEAM_TEST_LAYERS: capi
        run: |
          cd "$GITHUB_WORKSPACE"
          python -m pytest tests/test_inlined_glue.py tests/test_breakpoints.py tests/test_async.py::test_step_from_a_coroutine_into_native_code_and_back tests/test_inspection.py::test_optimized_locals_have_an_explanation tests/test_attach_blocked.py --opt O2 --target-python "$(which python)" --basetemp="$RUNNER_TEMP/optimized-focused" --junitxml=optimized-focused.xml -ra
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optimized-focused
          path: |
            optimized-focused.xml
            ${{ runner.temp }}/optimized-focused/
  fork-and-fault-regressions:
    if: ${{ !inputs.only || inputs.only == 'all' }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: arm64
      - run: python -m pip install pytest pybind11 nanobind cython uv
      - name: Fork cleanup and crash delivery
        env:
          SEAM_LLDB: /usr/bin/lldb
        run: |
          cd "$GITHUB_WORKSPACE"
          python -m pytest tests/test_children.py::test_fork tests/test_children.py::test_fork_made_by_native_code tests/test_children.py::test_subprocess_system_and_posix_spawn tests/test_children.py::test_native_step_over_fork_preserves_the_child tests/test_children.py::test_user_function_breakpoint_on_fork_is_not_hidden tests/test_crash.py::test_segfault_in_native_code_stops_with_the_merged_stack tests/test_pytest.py::test_segfault_in_an_extension_during_a_test --target-python "$(which python)" --basetemp="$RUNNER_TEMP/seam-focused" --junitxml=mac-focused.xml -vv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-fork-fault
          path: |
            mac-focused.xml
            ${{ runner.temp }}/seam-focused/
  packaged-editor:
    if: ${{ !inputs.only || inputs.only == 'all' }}
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Mac wheel and VSIX
        run: |
          python -m pip install build
          ARCHFLAGS='-arch arm64' MACOSX_DEPLOYMENT_TARGET=14.0 _PYTHON_HOST_PLATFORM=macosx-14.0-arm64 python -m build --wheel
          bash scripts/build-vsix.sh dist/*.whl
          cargo build --manifest-path examples/pyo3-demo/Cargo.toml
          cp examples/pyo3-demo/target/debug/libseam_demo.dylib examples/pyo3-demo/seam_demo.so
          npm install --prefix vscode/test --no-save @vscode/test-electron
      - name: Packaged adapter and real VS Code sessions
        env:
          SEAM_LLDB: /usr/bin/lldb
          SEAM_LOG: ${{ runner.temp }}/mac-editor.log
        run: |
          node vscode/test/unit.js --adapter
          export SEAM_VSIX="$(find "$GITHUB_WORKSPACE/vscode" -maxdepth 1 -name '*.vsix')"
          export SEAM_DEMO_DIR="$GITHUB_WORKSPACE/examples/pyo3-demo"
          node vscode/test/run.js
          node vscode/test/run.js python-extension
      - name: Installed wheel through Neovim's documented configuration
        env:
          SEAM_LLDB: /usr/bin/lldb
          SEAM_LOG: ${{ runner.temp }}/mac-neovim.log
        run: |
          command -v nvim || brew install neovim
          python -m venv "$RUNNER_TEMP/neovim-seam"
          "$RUNNER_TEMP/neovim-seam/bin/pip" install dist/*.whl
          git clone --quiet --depth 1 https://github.com/mfussenegger/nvim-dap "$RUNNER_TEMP/nvim-dap"
          SEAM_BIN="$RUNNER_TEMP/neovim-seam/bin/seam" nvim --headless -u NONE --cmd "set rtp+=$RUNNER_TEMP/nvim-dap" -l tests/editors/nvim_check.lua
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-packaged-editor
          path: |
            vscode/*.vsix
            dist/*.whl
            .vscode-test/**/logs/
            ${{ runner.temp }}/mac-editor.log*
            ${{ runner.temp }}/mac-neovim.log*
  native-features:
    if: ${{ !inputs.only || inputs.only == 'all' }}
    name: native features (${{ matrix.os }}, ${{ matrix.python }}, ${{ matrix.opt }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, python: '3.12', opt: O0, suite: full}
          - {os: macos-15, python: '3.13', opt: O0, suite: smoke}
          - {os: macos-15, python: '3.14', opt: O2, suite: smoke}
          - {os: macos-14, python: '3.12', opt: O0, suite: smoke}
          - {os: macos-14, python: '3.14', opt: O2, suite: smoke}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: arm64
      - name: Install test toolchains
        run: |
          python -m pip install pytest pybind11 nanobind cython uv
          uv python install 3.11 3.13t
          rustc --version
      - name: Existing smoke scenarios on Apple Silicon
        env:
          SEAM_LLDB: /usr/bin/lldb
          SEAM_TEST_STRICT: '1'
          SEAM_TEST_BUILD: ${{ runner.temp }}/native-build
        run: |
          cd "$GITHUB_WORKSPACE"
          selection=()
          if [ '${{ matrix.suite }}' = smoke ]; then selection=(-m smoke); fi
          python -m pytest tests "${selection[@]}" --target-python "$(which python)" --opt '${{ matrix.opt }}' --maxfail=12 -o faulthandler_timeout=90 -vv --basetemp="$RUNNER_TEMP/seam-pytest" --junitxml=mac-smoke.xml -ra
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.opt }}
          path: |
            mac-smoke.xml
            ${{ runner.temp }}/seam-pytest/
  installed-adapter:
    if: ${{ !inputs.only || inputs.only == 'all' }}
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: arm64
      - name: Record native toolchain
        run: |
          test "$(uname -m)" = arm64
          uname -a
          xcodebuild -version
          /usr/bin/lldb --version
          python -c 'import platform, sys; print(platform.machine(), sys.version); assert platform.machine() == "arm64"'
      - name: Build and install wheel
        run: |
          python -m pip install build
          ARCHFLAGS='-arch arm64' MACOSX_DEPLOYMENT_TARGET=14.0 _PYTHON_HOST_PLATFORM=macosx-14.0-arm64 python -m build --wheel
          python -m venv "$RUNNER_TEMP/seam-venv"
          "$RUNNER_TEMP/seam-venv/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/seam-venv/bin/python" -c 'import seam._target._seam_trap as h; import subprocess; subprocess.run(["file", h.__file__], check=True)'
      - name: Exercise installed adapter
        env:
          SEAM_LLDB: /usr/bin/lldb
        run: |
          "$RUNNER_TEMP/seam-venv/bin/python" scripts/macos-stage1-check.py --output stage1-results --repeat 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-stage1-python-${{ matrix.python }}
          path: |
            stage1-results/
            dist/*.whl

  debugger-exit-regressions:
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'debugger-exit-regressions' }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: arm64
      - run: python -m pip install pytest pybind11 nanobind cython
      - name: Stop sessions with living child processes
        env:
          SEAM_LLDB: /usr/bin/lldb
          SEAM_TEST_REPEAT: '5'
        run: python -m pytest tests/test_children.py::test_stopping_the_session_ends_the_children_in_the_programs_group --opt O2 --target-python "$(which python)" --basetemp="$RUNNER_TEMP/exit-checks" -o faulthandler_timeout=90 -vv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debugger-exit-checks
          path: ${{ runner.temp }}/exit-checks/

  real-projects-and-scale:
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'real-projects-and-scale' }}
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - run: python -m pip install pytest pybind11 nanobind cython uv
      - name: Build real extension projects with debug information
        env:
          SEAM_SCALE_DIR: ${{ runner.temp }}/scale
        run: |
          bash tools/build_projects.sh regex msgpack contourpy pydantic_core
          find "$SEAM_SCALE_DIR/venv" -name '*.so' -exec dsymutil {} \;
      - name: Real project sessions and 15000-function module
        env:
          SEAM_LLDB: /usr/bin/lldb
          SEAM_TEST_SCALE: '1'
          SEAM_TEST_PROJECTS: '1'
          SEAM_SCALE_DIR: ${{ runner.temp }}/scale
        run: |
          python -m pytest tests/test_projects.py tests/test_scale.py -k 'not pydantic_core_step_in_lands' --target-python "$SEAM_SCALE_DIR/venv/bin/python" --basetemp="$RUNNER_TEMP/real-checks" --junitxml=real-checks.xml -o faulthandler_timeout=120 -vv -s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-real-projects-and-scale
          path: |
            real-checks.xml
            ${{ runner.temp }}/real-checks/
            ${{ runner.temp }}/scale/report-*.md
