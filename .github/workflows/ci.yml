name: tests

on:
  push:
  workflow_dispatch:
    inputs:
      repeat:
        description: "Run each stepping scenario this many times"
        default: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install LLDB and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lldb gcc python3-dev
      - uses: astral-sh/setup-uv@v5
      - name: Run the suite
        env:
          SEAM_TEST_REPEAT: ${{ github.event.inputs.repeat || '1' }}
        run: scripts/test.sh -q
