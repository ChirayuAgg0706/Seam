name: tests

on:
  push:
    branches: [main]
  schedule:
    # Weekly: the whole suite against whatever the runner image, uv, PyO3 and friends
    # have become, plus a looped run of the stepping scenarios to catch nondeterminism.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      only:
        description: "Run one job only: full, smoke, lldb, editors, clean-machine or vsix (empty: all of them)"
        default: ""
      repeat:
        description: "Run each stepping scenario this many times (flakiness hunt)"
        default: "1"
      soak:
        description: "Soak only: pytest -k expression to loop (leave empty for a normal run)"
        default: ""
      soak_python:
        description: "Soak only: Python version (uv build)"
        default: "3.14"
      soak_lldb:
        description: "Soak only: LLDB version (18 is the distribution's default)"
        default: "18"
      soak_rounds:
        description: "Soak only: run the selection this many times over"
        default: "1"
      soak_load:
        description: "Soak only: CPU-burning processes to run alongside the tests"
        default: "0"

concurrency:
  # A push cancels the run of the push before it. Runs started by hand are left alone.
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

env:
  SEAM_TEST_STRICT: "1"   # a missing toolchain is a failure here, not a skip

jobs:
  full:
    if: ${{ !github.event.inputs.soak && (!github.event.inputs.only || github.event.inputs.only == 'full') }}
    name: full suite (3.12, -O0)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install LLDB and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lldb gcc g++ python3-dev
          sudo sysctl -w kernel.yama.ptrace_scope=0
      - uses: astral-sh/setup-uv@v5
      - name: Install interpreters Seam must refuse (3.11, free-threaded)
        run: uv python install 3.11 3.13t
      - name: Run the suite
        env:
          SEAM_TEST_REPEAT: ${{ github.event.inputs.repeat || '1' }}
          SEAM_TEST_PYTHON: /usr/bin/python3.12
        run: scripts/test.sh -q -rs

  # The jobs from here to `clean-machine` are the extended set. The repository is on
  # GitHub's free tier (2,000 runner minutes a month) and together they cost about 20
  # minutes, so they do not run on every push: they run weekly, when started by hand, and
  # on a push whose commit message contains [ci full].
  smoke:
    if: ${{ !github.event.inputs.soak && (!github.event.inputs.only || github.event.inputs.only == 'smoke') && (github.event_name != 'push' || contains(github.event.head_commit.message, '[ci full]')) }}
    name: smoke (${{ matrix.python }}, -${{ matrix.opt }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.12", opt: "O2" }
          - { python: "3.13", opt: "O0" }
          - { python: "3.14", opt: "O0" }
          - { python: "3.14", opt: "O2" }
          - { python: "3.15", opt: "O0" }   # a release candidate until 3.15.0 is out
    steps:
      - uses: actions/checkout@v4
      - name: Install LLDB and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lldb gcc g++ python3-dev
          sudo sysctl -w kernel.yama.ptrace_scope=0
      - uses: astral-sh/setup-uv@v5
      - name: Install the interpreter under test (a stripped standalone build)
        run: |
          uv python install ${{ matrix.python }}
          echo "SEAM_TEST_PYTHON=$(uv python find --python-preference only-managed ${{ matrix.python }})" >> "$GITHUB_ENV"
      - name: Run the smoke scenarios
        env:
          SEAM_TEST_OPT: ${{ matrix.opt }}
        run: scripts/test.sh -q -rs -m smoke

  lldb:
    if: ${{ !github.event.inputs.soak && (!github.event.inputs.only || github.event.inputs.only == 'lldb') && (github.event_name != 'push' || contains(github.event.head_commit.message, '[ci full]')) }}
    name: smoke (3.12, -O0, LLDB ${{ matrix.lldb }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lldb: ["19", "20"]   # the other jobs use the distribution's default, LLDB 18
    steps:
      - uses: actions/checkout@v4
      - name: Install LLDB ${{ matrix.lldb }} and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lldb-${{ matrix.lldb }} gcc g++ python3-dev
          sudo sysctl -w kernel.yama.ptrace_scope=0
          lldb-${{ matrix.lldb }} --version
      - uses: astral-sh/setup-uv@v5
      - name: Run the smoke scenarios
        env:
          SEAM_LLDB: lldb-${{ matrix.lldb }}
          SEAM_TEST_PYTHON: /usr/bin/python3.12
        run: scripts/test.sh -q -rs -m smoke

  editors:
    if: ${{ !github.event.inputs.soak && (!github.event.inputs.only || github.event.inputs.only == 'editors') && (github.event_name != 'push' || contains(github.event.head_commit.message, '[ci full]')) }}
    name: editors (VS Code extension host, Neovim headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SEAM_DEMO_DIR: ${{ github.workspace }}/examples/pyo3-demo
    steps:
      - uses: actions/checkout@v4
      - name: Install LLDB, build tools, a display server and screenshot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lldb gcc python3-dev python3-venv xvfb xdotool imagemagick scrot
          sudo sysctl -w kernel.yama.ptrace_scope=0
      - name: Build the demo project
        run: (cd examples/pyo3-demo && cargo build && cp target/debug/libseam_demo.so seam_demo.so)
      - name: Package the extension, with the adapter and its helper inside
        run: scripts/build-vsix.sh
      - name: The adapter inside the .vsix works, with no Seam installed
        run: |
          if command -v seam; then echo "seam is installed; this check must run without it"; exit 1; fi
          node vscode/test/unit.js --adapter
          python3 -m venv "$RUNNER_TEMP/pytest"
          "$RUNNER_TEMP/pytest/bin/pip" install --quiet "pytest>=8"
          SEAM_VSIX="$(ls vscode/*.vsix)" "$RUNNER_TEMP/pytest/bin/python" -m pytest -q -rs tests/editors/test_bundle.py
      - name: "VS Code: install the .vsix, open a project with a virtual environment, press F5"
        env:
          SEAM_LOG: ${{ runner.temp }}/seam-vscode.log
          SEAM_SHOTS: ${{ runner.temp }}/seam-shots
        run: |
          if command -v seam; then echo "seam is installed; this check must run without it"; exit 1; fi
          cd vscode/test
          npm install --no-save --no-audit --no-fund @vscode/test-electron
          SEAM_VSIX="$(ls "$GITHUB_WORKSPACE"/vscode/*.vsix)" xvfb-run -a -s "-screen 0 1600x1000x24" node run.js
      - name: "VS Code with the Python extension: the interpreter selected there is the one debugged"
        if: ${{ !cancelled() }}
        env:
          SEAM_LOG: ${{ runner.temp }}/seam-vscode-python.log
          SEAM_SHOTS: ${{ runner.temp }}/seam-shots
        run: |
          cd vscode/test
          npm install --no-save --no-audit --no-fund @vscode/test-electron
          SEAM_VSIX="$(ls "$GITHUB_WORKSPACE"/vscode/*.vsix)" xvfb-run -a -s "-screen 0 1600x1000x24" node run.js python-extension
      - name: Keep the pictures of the VS Code window, and the adapter logs behind them
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: editor-check-screenshots
          path: |
            ${{ runner.temp }}/seam-shots
            ${{ runner.temp }}/seam-vscode*.log*
          if-no-files-found: warn
      - name: Install Seam, which the Neovim configuration starts as `seam dap`
        if: ${{ !cancelled() }}
        run: |
          python3 -m venv "$HOME/.venvs/seam"
          "$HOME/.venvs/seam/bin/pip" install .
          echo "SEAM_BIN=$HOME/.venvs/seam/bin/seam" >> "$GITHUB_ENV"
      - name: "Neovim: the documented nvim-dap configuration debugs the demo"
        if: ${{ !cancelled() }}
        env:
          SEAM_LOG: ${{ runner.temp }}/seam-nvim.log
        run: |
          curl -fsSL https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz | tar xz -C "$HOME"
          git clone --quiet --depth 1 https://github.com/mfussenegger/nvim-dap "$HOME/nvim-dap"
          "$HOME/nvim-linux-x86_64/bin/nvim" --version | head -1
          "$HOME/nvim-linux-x86_64/bin/nvim" --headless -u NONE --cmd "set rtp+=$HOME/nvim-dap" -l tests/editors/nvim_check.lua
      - name: Keep the adapter logs if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-check-logs
          path: ${{ runner.temp }}/seam-*.log*
          if-no-files-found: ignore

  clean-machine:
    if: ${{ !github.event.inputs.soak && (!github.event.inputs.only || github.event.inputs.only == 'clean-machine') && (github.event_name != 'push' || contains(github.event.head_commit.message, '[ci full]')) }}
    name: clean machine (README install, PyO3 demo)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: ubuntu:24.04
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v4
      - name: Follow the README on a fresh Ubuntu 24.04
        run: scripts/clean-machine-check.sh

  vsix:
    if: ${{ !github.event.inputs.soak && (!github.event.inputs.only || github.event.inputs.only == 'vsix') }}
    name: lint, versions, VS Code extension package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Lint
        run: uvx ruff check src tests tools
      - name: Versions agree
        run: python3 tools/check_versions.py
      - name: Install what compiles the helper the extension carries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc python3-dev
      - name: Build the .vsix
        run: scripts/build-vsix.sh
      - name: The extension's own logic (interpreter, process list, adapter command line)
        run: node vscode/test/unit.js
      - uses: actions/upload-artifact@v4
        with:
          name: seam-vscode-extension
          path: vscode/*.vsix
          if-no-files-found: error

  soak:
    name: soak
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.soak != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOAK_PYTHON: ${{ github.event.inputs.soak_python || '3.14' }}
      SOAK_LLDB: ${{ github.event.inputs.soak_lldb || '18' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install LLDB and build tools
        run: |
          package=lldb
          if [ "$SOAK_LLDB" != 18 ]; then
            package="lldb-$SOAK_LLDB"
            echo "SEAM_LLDB=lldb-$SOAK_LLDB" >> "$GITHUB_ENV"
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "$package" gcc g++ python3-dev
          sudo sysctl -w kernel.yama.ptrace_scope=0
      - uses: astral-sh/setup-uv@v5
      - name: Install the interpreter under test
        run: |
          uv python install "$SOAK_PYTHON"
          echo "SEAM_TEST_PYTHON=$(uv python find --python-preference only-managed "$SOAK_PYTHON")" >> "$GITHUB_ENV"
      - name: Loop the selected scenarios
        env:
          # The weekly run loops the stepping, binding-layer and attach scenarios.
          SEAM_TEST_REPEAT: ${{ github.event_name == 'schedule' && '8' || github.event.inputs.repeat }}
          SOAK_SELECT: ${{ github.event.inputs.soak || 'test_stepping or test_bindings or test_attach' }}
          SOAK_ROUNDS: ${{ github.event.inputs.soak_rounds || '1' }}
          SOAK_LOAD: ${{ github.event.inputs.soak_load || '0' }}
        run: |
          # Races between Seam and LLDB show up when the machine is busy, so the loop
          # can be run with some cores kept spinning.
          for _ in $(seq "$SOAK_LOAD"); do (while :; do :; done) & done
          status=0
          mkdir -p "$RUNNER_TEMP/soak"
          for round in $(seq "$SOAK_ROUNDS"); do
            scripts/test.sh -q -p no:cacheprovider --basetemp="$RUNNER_TEMP/soak/$round" \
              -k "$SOAK_SELECT" || status=1
          done
          # What the adapter had to work around, counted from its logs.
          logs() { cat "$RUNNER_TEMP"/soak/*/*/seam*.log 2>/dev/null; }
          {
            echo "cores: $(nproc), busy: $SOAK_LOAD, rounds: $SOAK_ROUNDS, $(${SEAM_LLDB:-lldb} --version | head -1)"
            echo "continue requests: $(logs | grep -c '"command": "continue"')"
            echo "leftover stops ignored: $(logs | grep -c 'stop without a current reason')"
            echo "stale frame lists refreshed: $(logs | grep -c 'stale frame list')"
            echo "breakpoints reported by a thread no longer at them: $(logs | grep -c 'reports a breakpoint it is no longer at')"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          kill $(jobs -p) 2>/dev/null || true
          exit $status
