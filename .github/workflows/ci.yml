name: tests

on:
  push:
  workflow_dispatch:
    inputs:
      repeat:
        description: "Run each stepping scenario this many times (flakiness hunt)"
        default: "1"
      soak:
        description: "Soak only: pytest -k expression to loop (leave empty for a normal run)"
        default: ""
      soak_python:
        description: "Soak only: Python version (uv build)"
        default: "3.14"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SEAM_TEST_STRICT: "1"   # a missing toolchain is a failure here, not a skip

jobs:
  full:
    if: ${{ github.event.inputs.soak == '' || github.event.inputs.soak == null }}
    name: full suite (3.12, -O0)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install LLDB and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lldb gcc g++ python3-dev
          sudo sysctl -w kernel.yama.ptrace_scope=0
      - uses: astral-sh/setup-uv@v5
      - name: Run the suite
        env:
          SEAM_TEST_REPEAT: ${{ github.event.inputs.repeat || '1' }}
          SEAM_TEST_PYTHON: /usr/bin/python3.12
        run: scripts/test.sh -q

  smoke:
    if: ${{ github.event.inputs.soak == '' || github.event.inputs.soak == null }}
    name: smoke (${{ matrix.python }}, -${{ matrix.opt }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.12", opt: "O2" }
          - { python: "3.13", opt: "O0" }
          - { python: "3.13", opt: "O2" }
          - { python: "3.14", opt: "O0" }
          - { python: "3.14", opt: "O2" }
    steps:
      - uses: actions/checkout@v4
      - name: Install LLDB and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lldb gcc g++ python3-dev
          sudo sysctl -w kernel.yama.ptrace_scope=0
      - uses: astral-sh/setup-uv@v5
      - name: Install the interpreter under test (a stripped standalone build)
        run: |
          uv python install ${{ matrix.python }}
          echo "SEAM_TEST_PYTHON=$(uv python find --python-preference only-managed ${{ matrix.python }})" >> "$GITHUB_ENV"
      - name: Run the smoke scenarios
        env:
          SEAM_TEST_OPT: ${{ matrix.opt }}
        run: scripts/test.sh -q -m smoke

  clean-machine:
    if: ${{ github.event.inputs.soak == '' || github.event.inputs.soak == null }}
    name: clean machine (README install, PyO3 demo)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: ubuntu:24.04
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v4
      - name: Follow the README on a fresh Ubuntu 24.04
        run: scripts/clean-machine-check.sh

  vsix:
    if: ${{ github.event.inputs.soak == '' || github.event.inputs.soak == null }}
    name: VS Code extension package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the .vsix
        run: scripts/build-vsix.sh
      - uses: actions/upload-artifact@v4
        with:
          name: seam-vscode-extension
          path: vscode/*.vsix
          if-no-files-found: error

  soak:
    name: soak (${{ github.event.inputs.soak }})
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.soak != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install LLDB and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lldb gcc g++ python3-dev
          sudo sysctl -w kernel.yama.ptrace_scope=0
      - uses: astral-sh/setup-uv@v5
      - name: Install the interpreter under test
        run: |
          uv python install ${{ github.event.inputs.soak_python }}
          echo "SEAM_TEST_PYTHON=$(uv python find --python-preference only-managed ${{ github.event.inputs.soak_python }})" >> "$GITHUB_ENV"
      - name: Loop the selected scenarios
        env:
          SEAM_TEST_REPEAT: ${{ github.event.inputs.repeat }}
        run: scripts/test.sh -q -k "${{ github.event.inputs.soak }}"
